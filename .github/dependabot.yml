version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/' # single root lockfile covers all hoisted workspaces (no per-pkg dirs)
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    cooldown:
      default-days: 3
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 30
    ignore:
      - dependency-name: '@sensigo/*' # workspace-linked, resolve locally
    groups:
      build-toolchain: # FIRST (first-match-wins priority) — shipped-byte/CI-infra toolchain, never auto-merge
        dependency-type: 'development'
        patterns: ['typescript', 'turbo', 'audit-ci']
      linters: # formatter/linter bumps change CI format:check/lint OUTPUT → deterministically red ci → never auto-merge, need a manual reformat/rule-fix (see #238 canary PRs #248 prettier / #249 @eslint/js)
        dependency-type: 'development'
        patterns: ['prettier', 'eslint', '@eslint/js', 'typescript-eslint']
      prod:
        dependency-type: 'production'
        update-types: ['minor', 'patch']
      dev-patch:
        dependency-type: 'development'
        update-types: ['patch']
        # structural exclusion (order-independent) — build-toolchain + linters must never fall into an auto-merge-eligible group
        exclude-patterns:
          [
            'typescript',
            'turbo',
            'audit-ci',
            'prettier',
            'eslint',
            '@eslint/js',
            'typescript-eslint',
          ]
      dev-minor:
        dependency-type: 'development'
        update-types: ['minor']
        exclude-patterns:
          [
            'typescript',
            'turbo',
            'audit-ci',
            'prettier',
            'eslint',
            '@eslint/js',
            'typescript-eslint',
          ]

  - package-ecosystem: 'github-actions'
    directory: '/' # scans ALL of .github/workflows — NO per-file scope exists (B1 is procedural, see below)
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7 # github-actions supports ONLY default-days (semver-*-days are unsupported here)
    groups:
      github-actions: # one human-reviewed, NEVER-auto-merged PR for every action bump across all workflows
        patterns: ['*']
