name: Scheduled dependency audit (tier-2)

on:
  schedule:
    # Weekly, Monday ~06:17 UTC — off-:00 to dodge cron congestion on the hour.
    - cron: '17 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
      # issue #326 — the action-pin truth guard, same check as ci.yml runs on every PR. Run here
      # TOO, on the weekly clock: this is what catches an upstream tag RE-POINT that happens
      # between PRs, when nothing in this repo changed at all and the PR gate never re-runs.
      - run: node scripts/check-action-pins.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm ci
      # issue #238 PR2 (D4) — validates BOTH audit-ci.jsonc and audit-ci.tier2.jsonc (and the
      # tier-1 ⊆ tier-2 subset invariant) before the audit itself runs.
      - run: node scripts/check-audit-allowlist.mjs
      # Tier-2: the broader safety net (moderate+, incl. devDependencies) — does NOT block PRs
      # (this is a scheduled workflow, not a required check); a finding fails this run (failure
      # email) and, via the next step, files/updates a tracking issue.
      - name: Tier-2 audit (moderate, incl. devDependencies)
        id: audit
        run: |
          set -o pipefail
          npm run audit:full 2>&1 | tee "$RUNNER_TEMP/audit-output.txt"
      # Only a genuine audit finding files/updates the tracking issue — `steps.audit.outcome ==
      # 'failure'` is load-bearing: a failed `npm ci`/guard step ABOVE this also reds the run (the
      # failure email still fires), but must NOT be mistaken for "advisories found" and must NOT
      # file this issue.
      - name: File or update the tracking issue
        if: failure() && steps.audit.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_OUTPUT_FILE: ${{ runner.temp }}/audit-output.txt
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/file-audit-issue.mjs
      # issue #327 — weekly dead-dependency detection (knip, `--dependencies` scope: unused +
      # unlisted/phantom dependencies, v1). `if: ${{ !cancelled() }}` is load-bearing (audit
      # finding S2): without it, a red tier-2 audit step above would skip this step via GitHub
      # Actions' implicit success()-only default, silently omitting dead-dep detection in exactly
      # the weeks the dependency tree churns enough to trip BOTH audits. `!cancelled()` still lets
      # the step skip on a cancelled run, just not on an ordinary step failure.
      - name: Dead-dependency audit (knip, dependencies-only)
        id: knip
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          npm run deps:audit 2>&1 | tee "$RUNNER_TEMP/knip-output.txt"
      # Same `outcome == 'failure'`-gated pattern as the tier-2 audit above — only a genuine knip
      # finding files/updates this (separately-titled) tracking issue.
      - name: File or update the tracking issue (knip dead dependencies)
        if: failure() && steps.knip.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_OUTPUT_FILE: ${{ runner.temp }}/knip-output.txt
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/file-audit-issue.mjs knip
