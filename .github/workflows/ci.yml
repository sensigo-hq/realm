name: CI

on:
  push:
    branches: [main]
  pull_request:
  # GitHub's merge queue runs a workflow only on this event, on the merge group it builds from the
  # queue's head and the pull request: the required checks (`ci`, `Analyse TypeScript`, `CodeQL`) must
  # report there, or the queue waits and then fails the merge.
  merge_group:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
      # issue #326 — the action-pin truth guard: every `uses:` SHA must match the tag its trailing
      # comment names (never just resolve — mismatch, imprecision, and cross-file non-uniformity
      # all fail). Placed BEFORE `npm ci`, unlike the audit-allowlist guard below it: this script
      # has ZERO npm dependencies (only Node 24 built-ins), so there is no reason to pay for a
      # dependency install before a check that can fail on its own — fail fast.
      - run: node scripts/check-action-pins.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm ci
      # issue #238 PR1 (D6) — the allowlist GHSA-id guard: audit-ci.jsonc's allowlist is the single
      # source of truth for every accepted advisory suppression; this asserts every entry is
      # GHSA-id-scoped (never a bare-string module-wide suppression).
      - run: node scripts/check-audit-allowlist.mjs
      # issue #238 PR1 (D5) — the PR-blocking audit gate. Invoked via the `audit:ci` npm script
      # (issue #238 PR2, D2) — `npm run` prepends node_modules/.bin to PATH, so this resolves the
      # same pinned local binary as before, network-free, and is the same invocation PR4's
      # release-audit step reuses. The only required check this repo has for dependency advisories.
      - run: npm run audit:ci
      # issue #238 PR1 (D7) — positive coverage assertion (R7 mitigation). `ajv` is
      # @sensigo/realm's declared prod dependency; if audit-ci's `skip-dev` (or a future
      # `--omit=dev`/`--production` narrowing) ever silently excluded the workspace prod tree from
      # scan coverage, this reds — a synthetic proof the gate above is actually scanning what it
      # claims to scan, not just passing vacuously on an empty/under-scoped tree.
      - run: npm ls ajv --omit=dev
      - run: node scripts/check-versions.mjs
      # issue #620 PR-A (D8) — the release scripts' own tests. Not an npm script: a root script
      # running `node --test` makes knip's `node` plugin treat test files as entries in every
      # workspace (knip/dist/plugins/node/index.js:26 reads the root manifest's scripts), which
      # would turn `npm run deps:audit` red.
      - run: node --test 'scripts/test/*.test.mjs'
      - run: npm run format:check
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      # issue #620 PR-B — every class a package exports carries the release mark. Needs the built packages.
      - run: npm run check:brands
      # The website (realmengine.dev) is built from docs/. Its build stops on a docs page with no
      # description, a description shared with another page, a page left out of the sidebar, or a
      # title the page's preview image cannot draw. Building it here stops such a page on its pull
      # request instead of at the next deploy. website/ is not an npm workspace: it has its own
      # lockfile. Install scripts are skipped, as the repository's .npmrc skips them for the root.
      - name: Build the website
        working-directory: website
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      # issue #337 — type-check the test files. `tsconfig.eslint.json` is the only project that
      # includes `*.test.ts` (the per-package build tsconfigs exclude them), so until now tsc never
      # saw them and 351 type errors had accumulated unseen — including assertions that could not
      # fail. The same "make the invisible visible, then gate it" move as #293's typed store seam.
      #
      # MUST run AFTER `npm run build`: this typecheck resolves `@sensigo/realm` to
      # packages/core/dist/index.d.ts through the package exports map. On a fresh runner with no
      # dist it reds on a wall of TS2307 even with every fix in place. (`lint` survives beside it
      # only because typescript-eslint doesn't surface TS2307.) ~9-11s.
      - run: npm run typecheck:tests

  # Every package says it runs on Node 22 or later (`engines`), but the job above tests Node 24
  # only, so a break on Node 22 would ship unseen. This job runs the whole test suite on Node 22.
  # 22.22.3 is the oldest Node 22 that the SQLite store of issue #616 will run on. It is a job of
  # its own, not a matrix entry on the job above: the main branch's rules require a check named
  # exactly `ci`, and a matrix would rename it.
  node22:
    runs-on: ubuntu-latest
    env:
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.3'
          cache: 'npm'
      - run: npm ci
      # `npm run test` builds the five packages first (turbo.json), so no separate build step.
      - run: npm run test

  # issue #616 PR-1a unit 11 — the SQLite store's floors, each in a job of its own (not a matrix entry
  # of `ci`, whose name the main branch's rules require). None of these jobs is a required check:
  # read them on every pull request that touches the store.
  #
  # Node 24.15.0 is the first Node 24 that bundles SQLite 3.51.3, the release that fixes SQLite's
  # WAL-reset bug, and so the store's floor on the 24 line. The whole suite runs on it, as `node22`
  # runs it on 22.22.3, the floor on the 22 line.
  node24-floor:
    runs-on: ubuntu-latest
    env:
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.15.0'
          cache: 'npm'
      - run: npm ci
      # `npm run test` builds the five packages first (turbo.json), so no separate build step.
      - run: npm run test

  # Below the floor: Node 22.22.2 and 24.14.1, the releases just before each floor, bundle SQLite
  # 3.51.2, which has the WAL-reset bug. The store must refuse to open there. The check asserts that
  # this Node reports a SQLite below 3.51.3, and that `openRealmHome` refuses with
  # STATE_STORE_DRIVER_UNAVAILABLE, naming that version, without making the home
  # (packages/store-sqlite/ci/below-floor.mjs).
  sqlite-below-floor:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.22.2', '24.14.1']
    env:
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      # The store package and core, which it imports.
      - run: npx turbo run build --filter=@sensigo/realm-store-sqlite
      - run: node packages/store-sqlite/ci/below-floor.mjs

  # issue #616 PR-2c c10b-3b, design-d4's packaging law (A): a host that injects its own stores can use
  # the library on a Node with no SQLite at all. The script checks that this Node has none (so the leg
  # checks something), loads the built library and serves one tool call over in-memory stores
  # (packages/mcp-server/ci/library-on-node20.mjs). Only the script runs here, never the suite. Not a
  # required check.
  node20-library:
    runs-on: ubuntu-latest
    env:
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20.20.2'
          cache: 'npm'
      - run: npm ci
      # The library and the testing package, with core and the store package by dependency.
      - run: npx turbo run build --filter=@sensigo/realm-mcp --filter=@sensigo/realm-testing
      - run: node packages/mcp-server/ci/library-on-node20.mjs

  # macOS: only the store package's tests, on a real runner (its mount table, `fullfsync`, the
  # filesystem gate), on Node 24.15.0, the Node the owner's Mac runs. The wider suite has never run
  # on macOS; this job does not take it on.
  store-sqlite-macos:
    runs-on: macos-latest
    env:
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.15.0'
          cache: 'npm'
      - run: npm ci
      # The test task builds the five packages first (turbo.json), then runs this package's tests.
      - run: npx turbo run test --filter=@sensigo/realm-store-sqlite
