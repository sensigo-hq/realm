name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The merge queue's event (see ci.yml): the merge groups that target main.
  merge_group:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1' # weekly on Monday at 03:00 UTC

permissions:
  contents: read
  security-events: write

jobs:
  analyse:
    name: Analyse TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialise CodeQL
        uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          languages: javascript-typescript

      - name: Perform analysis
        uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          category: '/language:javascript-typescript'
