pre-commit:
  commands:
    format:
      run: npm run format
      stage_fixed: true
    lint:
      run: npm run lint
    control-bytes:
      glob: '*.{ts,js,mjs,cjs,yaml,yml,json,md}'
      run: |
        bad=$(printf '%s\n' {staged_files} | xargs -r grep -l -P '[\x00-\x08\x0B\x0C\x0E-\x1F]' 2>/dev/null || true)
        if [ -n "$bad" ]; then
          echo "Raw control bytes (e.g. NUL) in source — write them as escapes (\\u0000):"
          echo "$bad"
          exit 1
        fi
