# realmengine.dev: the site's own nginx rules, kept here so they are reviewed with the site.
#
# Installed on the server as /etc/nginx/snippets/realmengine-site.conf and included inside the
# HTTPS server block for realmengine.dev (the one with "root /var/www/realmengine.dev"):
#
#     include /etc/nginx/snippets/realmengine-site.conf;
#
# Deploy: copy this file there, run "sudo nginx -t", then "sudo systemctl reload nginx".
# An address that moves gets a permanent redirect here, never a 404.

# The Markdown copies of the docs pages (/docs/<page>.md, /docs.md): nginx has no .md type,
# so without this they would be sent as downloads.
location ~* \.md$ {
    types { }
    default_type "text/markdown; charset=utf-8";
    try_files $uri =404;
}

# The sitemap moved to /sitemap.xml (website/src/integrations/sitemap-at-root.mjs).
location = /sitemap-index.xml { return 301 https://realmengine.dev/sitemap.xml; }
location = /sitemap-0.xml     { return 301 https://realmengine.dev/sitemap.xml; }

# docs/start/what-realm-is.md was renamed docs/start/what-is-realm.md (2026-10-04).
location = /docs/start/what-realm-is/    { return 301 https://realmengine.dev/docs/start/what-is-realm/; }
location = /docs/start/what-realm-is     { return 301 https://realmengine.dev/docs/start/what-is-realm/; }
location = /docs/start/what-realm-is.md  { return 301 https://realmengine.dev/docs/start/what-is-realm.md; }
location = /og/docs/start/what-realm-is.png { return 301 https://realmengine.dev/og/docs/start/what-is-realm.png; }
