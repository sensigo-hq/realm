# realmengine.dev: the site's own nginx rules, kept here so they are reviewed with the site.
#
# Installed on the server as /etc/nginx/snippets/realmengine-site.conf and included inside the
# HTTPS server block for realmengine.dev (the one with "root /var/www/realmengine.dev"):
#
#     include /etc/nginx/snippets/realmengine-site.conf;
#
# Deploy order, so no old address is missing while the site changes:
#   1. rsync the new dist/ WITHOUT --delete (the new files arrive, the old ones stay);
#   2. keep a dated copy of the installed snippet (/etc/nginx/snippets/realmengine-site.conf), copy
#      this file there, run "sudo nginx -t", then "sudo systemctl reload nginx";
#   3. rsync again WITH --delete (the old files go; their addresses now redirect).
# When a page or file moves, add a permanent redirect here from each address it was served at.
# Write each redirect as "location =" (one address) or "location ^~" (an address and everything under
# it). A plain prefix location ("location /docs/old/") would never run for an address ending in "/":
# nginx prefers the Markdown rule below, a regular expression, over any plain prefix.

# A missing address gets the site's own "not found" page (404.html, which Starlight builds),
# not nginx's bare one. A folder that has no page of its own (/docs/start/, /og/) gets the same
# answer: nginx calls that "403 Forbidden", but to a visitor it is a page that does not exist.
# 404.html itself is only reachable this way, so a direct request for it is a 404 as well.
error_page 403 404 =404 /404.html;
location = /404.html { internal; }

# For the errors not handed to 404.html (a malformed request, a server error), nginx still writes
# its own page; this keeps nginx's version number off those pages and out of the Server header.
server_tokens off;

# The Markdown copies of the pages (/docs/<page>.md, /docs.md, /compare.md): nginx has no .md type,
# so without this they would be sent as downloads.
location ~* \.md$ {
    types { }
    default_type "text/markdown; charset=utf-8";
    try_files $uri =404;
}

# A request that asks for Markdown (its Accept header names text/markdown, as Claude Code and Cursor send)
# gets the page's Markdown copy at the page's own address, when the page has one: /docs/<page>/ answers
# with /docs/<page>.md, /docs/ with /docs.md, /compare/ with /compare.md. A page with no copy (/,
# /how-it-works/) answers with its HTML, as does every request that does not ask for Markdown.
# The server-level "set" and "if" run before a location is chosen; the location serves the copy if it
# exists, else the page's index.html, else the site's 404 page.
# Preference weights are not compared: a request that names text/markdown with any weight but zero
# gets Markdown, and "text/markdown;q=0" (Markdown refused) gets HTML. The agents known to ask for
# Markdown list it first.
# Cloudflare does not cache these responses today (cf-cache-status: DYNAMIC). If HTML caching is ever
# turned on, its cache key must include the Accept header, or one reader's Markdown reaches another.
# A page and its copy can carry the same Last-Modified second, so a cache that ignored Vary could also
# answer a conditional request for one with the other.
set $md_suffix ".no-markdown-asked";
if ($http_accept ~* "text/markdown") {
    set $md_suffix ".md";
}
if ($http_accept ~* "text/markdown[^,]*;\s*q\s*=\s*0(\.0{0,3})?\s*(,|$)") {
    set $md_suffix ".no-markdown-asked";
}
# \z, not $: in a regular expression "$" also matches before a final newline, so /compare/%0A would
# match and be served as /compare/.
location ~ ^(?<md_page>/.+)/\z {
    # Served from here: the Markdown copy (no .html ending) or the page's index.html.
    types { text/html html; }
    default_type "text/markdown; charset=utf-8";
    # The answer depends on the Accept header; Vary tells caches to keep the two apart.
    add_header Vary Accept;
    try_files $md_page$md_suffix ${uri}index.html =404;
}

# The sitemap moved to /sitemap.xml (SITEMAP_PATH in website/src/lib/site-meta.mjs).
location = /sitemap-index.xml { return 301 https://realmengine.dev/sitemap.xml; }
location = /sitemap-0.xml     { return 301 https://realmengine.dev/sitemap.xml; }

# docs/start/what-realm-is.md was renamed docs/start/what-is-realm.md (2026-10-04).
location = /docs/start/what-realm-is/    { return 301 https://realmengine.dev/docs/start/what-is-realm/; }
location = /docs/start/what-realm-is     { return 301 https://realmengine.dev/docs/start/what-is-realm/; }
location = /docs/start/what-realm-is/index.html { return 301 https://realmengine.dev/docs/start/what-is-realm/; }
location = /docs/start/what-realm-is.md  { return 301 https://realmengine.dev/docs/start/what-is-realm.md; }
location = /og/docs/start/what-realm-is.png { return 301 https://realmengine.dev/og/docs/start/what-is-realm.png; }
