# realmengine.dev: the site's own nginx rules, kept here so they are reviewed with the site.
#
# Installed on the server as /etc/nginx/snippets/realmengine-site.conf and included inside the
# HTTPS server block for realmengine.dev (the one with "root /var/www/realmengine.dev"):
#
#     include /etc/nginx/snippets/realmengine-site.conf;
#
# Deploy order, so no old address is missing while the site changes:
#   1. rsync the new dist/ WITHOUT --delete (the new files arrive, the old ones stay);
#   2. copy this file there, run "sudo nginx -t", then "sudo systemctl reload nginx";
#   3. rsync again WITH --delete (the old files go; their addresses now redirect).
# When a page or file moves, add a permanent redirect here from each address it was served at.

# A missing address gets the site's own "not found" page (404.html, which Starlight builds),
# not nginx's bare one. A folder that has no page of its own (/docs/start/, /og/) gets the same
# answer: nginx calls that "403 Forbidden", but to a visitor it is a page that does not exist.
# 404.html itself is only reachable this way, so a direct request for it is a 404 as well.
error_page 403 404 =404 /404.html;
location = /404.html { internal; }

# For the errors not handed to 404.html (a malformed request, a server error), nginx still writes
# its own page; this keeps nginx's version number off those pages and out of the Server header.
server_tokens off;

# The Markdown copies of the docs pages (/docs/<page>.md, /docs.md): nginx has no .md type,
# so without this they would be sent as downloads.
location ~* \.md$ {
    types { }
    default_type "text/markdown; charset=utf-8";
    try_files $uri =404;
}

# The sitemap moved to /sitemap.xml (SITEMAP_PATH in website/src/lib/site-meta.mjs).
location = /sitemap-index.xml { return 301 https://realmengine.dev/sitemap.xml; }
location = /sitemap-0.xml     { return 301 https://realmengine.dev/sitemap.xml; }

# docs/start/what-realm-is.md was renamed docs/start/what-is-realm.md (2026-10-04).
location = /docs/start/what-realm-is/    { return 301 https://realmengine.dev/docs/start/what-is-realm/; }
location = /docs/start/what-realm-is     { return 301 https://realmengine.dev/docs/start/what-is-realm/; }
location = /docs/start/what-realm-is/index.html { return 301 https://realmengine.dev/docs/start/what-is-realm/; }
location = /docs/start/what-realm-is.md  { return 301 https://realmengine.dev/docs/start/what-is-realm.md; }
location = /og/docs/start/what-realm-is.png { return 301 https://realmengine.dev/og/docs/start/what-is-realm.png; }
